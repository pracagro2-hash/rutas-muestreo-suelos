<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E2D91">
<meta name="description" content="Planificación, navegación y seguimiento del muestreo de suelos — Ingenio Providencia">
<title>Rutas de muestreo de suelos — Ingenio Providencia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="app/iconos/icono-192.png">
<link rel="apple-touch-icon" href="app/iconos/icono-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<header id="cabecera">
  <div class="cab-fila">
    <div class="cab-titulo"><h1 id="tituloApp">Rutas de muestreo de suelos — Ingenio Providencia</h1><small id="subtitulo">Cargando…</small></div>
    <button id="chipSync" class="local" title="Estado de la sincronización">…</button>
  </div>
  <div class="filtros">
    <select id="selDia" aria-label="Filtrar por día"></select>
    <select id="selEstado" aria-label="Filtrar por estado"></select>
  </div>
</header>

<div id="mapa" role="application" aria-label="Mapa de rutas de muestreo"></div>
<div id="barraAvance" aria-live="polite"></div>
<div class="fabs">
  <button class="fab" id="btnGps" title="Mostrar mi ubicación" aria-label="Mi ubicación">📍</button>
  <button class="fab" id="btnSiguiente" title="Siguiente punto pendiente" aria-label="Siguiente punto pendiente">⏭️</button>
  <button class="fab" id="btnTodo" title="Mostrar todas las rutas" aria-label="Mostrar todas las rutas">🔍</button>
  <button class="fab" id="btnCapa" title="Satélite / calles" aria-label="Cambiar mapa base">🗺️</button>
</div>

<section class="vista" id="vistaLista" aria-label="Lista de puntos">
  <div class="contenido"><h2>Puntos de muestreo</h2>
    <input id="buscar" class="buscador" type="search" placeholder="Buscar por ID o suerte" aria-label="Buscar punto">
    <div id="listaPuntos"></div></div>
</section>
<section class="vista" id="vistaEstadisticas" aria-label="Estadísticas"><div class="contenido"></div></section>
<section class="vista" id="vistaMas" aria-label="Más opciones"><div class="contenido"></div></section>

<div id="velo"></div>
<div id="ficha" role="dialog" aria-label="Ficha del punto"></div>
<div id="toast" role="status"></div>

<nav id="nav" aria-label="Navegación">
  <button data-vista="mapa" class="activo"><span class="ic">🗺️</span>Mapa</button>
  <button data-vista="lista"><span class="ic">📋</span>Lista</button>
  <button data-vista="estadisticas"><span class="ic">📊</span>Estadísticas</button>
  <button data-vista="mas"><span class="ic">☰</span>Más</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app/config.js"></script>
<script src="app/logica.js"></script>
<script src="app/almacen.js"></script>
<script src="app/sync.js"></script>
<script>window.APP_INGENIO = "PROVIDENCIA";</script>
<script src="data/providencia.js"></script>
<script src="app/app.js"></script>
</body>
</html>
